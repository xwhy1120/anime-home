<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机番剧推荐</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="logo">番</div>
      <h1>随机番剧推荐</h1>
      <p>搜索番剧，随机发现，记录想看和看过</p>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索番剧" />
        <button id="searchBtn">搜索</button>
      </div>

      <div class="actions">
        <button id="randomBtn" class="main-btn">随机推荐一部番剧</button>
        <button class="filter-btn active" data-filter="全部">全部记录</button>
        <button class="filter-btn" data-filter="想看">想看</button>
        <button class="filter-btn" data-filter="在看">在看</button>
        <button class="filter-btn" data-filter="看过">看过</button>
        <button class="filter-btn" data-filter="弃了">弃了</button>
      </div>
    </section>

    <section class="result-head">
      <h2 id="resultTitle">开始搜索，或者随机推荐一部</h2>
      <p id="resultTip">数据来自 Bangumi。搜索中文名通常更准，也可以试试日文名。</p>
    </section>

    <section id="resultList" class="grid"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
