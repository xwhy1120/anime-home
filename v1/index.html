<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机番剧推荐 V2</title>
  <link rel="stylesheet" href="style.css" />
</head>
  <a class="back-v2-link" href="../">返回 V2</a>
<body>
  <main class="page">
    <section class="hero">
      <div class="top-links">
        <a href="./v1/">V1</a>
        <a href="https://bgm.tv/" target="_blank" rel="noreferrer">Bangumi</a>
      </div>

      <div class="logo">番</div>
      <h1>随机番剧推荐</h1>
      <p>搜索、随机、记录你的补番清单</p>

      <div class="search-shell">
        <input id="searchInput" type="text" autocomplete="off" placeholder="搜索番剧，例如：孤独摇滚、药屋少女、芙莉莲" />
        <button id="searchBtn">搜索</button>
      </div>

      <div class="quick-actions">
        <button id="randomBtn" class="primary-btn">随机一部</button>

        <label class="switch">
          <input id="skipWatchedInput" type="checkbox" checked />
          <span></span>
          <b>跳过看过和弃了</b>
        </label>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="全部">全部记录</button>
        <button class="filter-btn" data-filter="想看">想看</button>
        <button class="filter-btn" data-filter="在看">在看</button>
        <button class="filter-btn" data-filter="看过">看过</button>
        <button class="filter-btn" data-filter="弃了">弃了</button>
      </div>
    </section>

    <section class="result-head">
      <div>
        <h2 id="resultTitle">准备好了</h2>
        <p id="resultTip">输入番名搜索，或者随机邂逅一部。</p>
      </div>
      <button id="clearBtn" class="ghost-btn">清空结果</button>
    </section>

    <section id="resultList" class="grid"></section>
  </main>

  <template id="cardSkeleton">
    <article class="card skeleton-card">
      <div class="cover-wrap shimmer"></div>
      <div class="body">
        <div class="line shimmer"></div>
        <div class="line short shimmer"></div>
        <div class="chips">
          <span class="chip shimmer"></span>
          <span class="chip shimmer"></span>
          <span class="chip shimmer"></span>
        </div>
        <div class="text-block shimmer"></div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
